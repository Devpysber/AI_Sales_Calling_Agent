# Single-server setup: one app container (API + dashboard + scheduler), Postgres, Redis.
#   docker compose up -d --build
# For horizontal scaling use docker-compose.prod.yml.

services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://voiceagent:${POSTGRES_PASSWORD:-voiceagent}@postgres:5432/voiceagent
      REDIS_URL: redis://redis:6379/0
      RUN_SCHEDULER: "true"
      RUN_MIGRATIONS: "true"
      WEB_CONCURRENCY: "2"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voiceagent
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceagent}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U voiceagent"], interval: 5s, retries: 10 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
