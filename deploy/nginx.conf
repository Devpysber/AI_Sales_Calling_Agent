# Load balancer + TLS termination point for the API replicas.
# Put this behind your cloud LB / Cloudflare, or add certificates (see README).

worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  client_max_body_size 30m;

  gzip on;
  gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
  gzip_min_length 1024;

  log_format main '$remote_addr "$request" $status $body_bytes_sent ${request_time}s upstream=$upstream_addr rt=$upstream_response_time';
  access_log /dev/stdout main;

  # Docker DNS: re-resolve the api service so scaled replicas join the pool
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api {
    zone api 64k;
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=apiz:10m rate=30r/s;

  map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 60s;
    proxy_next_upstream error timeout http_502 http_503;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://api;
    }

    # Plivo webhooks and generated audio: never rate limited
    location /api/plivo/ { proxy_pass http://api; }
    location /api/media/ { proxy_pass http://api; }

    location /api/ {
      limit_req zone=apiz burst=60 nodelay;
      proxy_pass http://api;
    }

    # SPA static assets (fingerprinted)
    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
