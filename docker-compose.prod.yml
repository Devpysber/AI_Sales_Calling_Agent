# Horizontally scaled deployment
#
#   nginx (load balancer, static dashboard, rate limits)
#     └── api × N   (stateless FastAPI/gunicorn; call state in Redis)
#   worker          (scheduler: auto-dial, retries, reminders — Redis leader lock)
#   migrate         (one-off job per deploy)
#   postgres, redis
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml up -d --scale api=6     # scale out
#
# In cloud production prefer managed Postgres (RDS/Cloud SQL) and Redis (ElastiCache/Memorystore):
# point DATABASE_URL / REDIS_URL at them and drop the postgres/redis services.

x-app: &app
  build: .
  env_file: .env
  environment: &app-env
    ENVIRONMENT: production
    DATABASE_URL: postgresql+psycopg://voiceagent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/voiceagent
    REDIS_URL: redis://redis:6379/0
    RUN_MIGRATIONS: "false"
    RUN_SCHEDULER: "false"
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *app-env
      WEB_CONCURRENCY: "4"
      DB_POOL_SIZE: "10"
    deploy:
      replicas: 3
      resources: { limits: { cpus: "1.0", memory: 768M } }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  nginx:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voiceagent
      POSTGRES_USER: voiceagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U voiceagent"], interval: 5s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20 }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
